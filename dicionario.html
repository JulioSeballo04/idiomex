<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Dicionário — Dicionário</title>
<script>
  // Aplica o tema salvo antes da página desenhar, pra não piscar a cor padrão
  (function () {
    var tema = localStorage.getItem("temaEscolhido");
    if (tema && tema !== "classico") document.documentElement.setAttribute("data-tema", tema);
  })();
</script>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/novidades.css">
</head>
<body>

<div class="app-shell">
  <nav class="indice-letras">
    <div class="marca">Aa</div>
    <div id="indice-letras-lista"></div>
  </nav>

  <main class="conteudo">
    <div class="topo-app">
      <div class="saudacao">
        <div class="eyebrow" id="eyebrow-topo">SEU VOCABULÁRIO</div>
        <h1 id="titulo-topo">Olá!</h1>
        <div class="contador-total" id="contador-total"></div>
      </div>
      <div class="acoes-topo">
        <button class="btn btn-secundario" onclick="iniciarQuiz()">🎯 Quiz rápido</button>
        <button class="btn btn-secundario" onclick="abrirAgendamento()">📅 Agendar aula</button>
        <button class="btn btn-secundario" onclick="abrirPerfil()">👤 Meu perfil</button>
        <div class="seletor-tema" id="seletor-tema">
          <button class="btn-tema" type="button" title="Mudar cores do app" onclick="alternarMenuTema()">
            <span class="ponto-tema-atual" id="ponto-tema-atual"></span>
          </button>
          <div class="menu-tema oculto" id="menu-tema"></div>
        </div>
        <button class="btn btn-secundario" onclick="sair()">Sair</button>
      </div>
    </div>

    <div id="modal-quiz" class="modal-oculto">
      <div class="modal-conteudo">
        <div class="modal-cabecalho">
          <h3>Quiz rápido</h3>
          <button type="button" class="btn-fechar-modal" title="Fechar" onclick="fecharQuiz()">✕</button>
        </div>
        <p style="color:var(--ink-soft, #666); font-size:0.85rem; margin-top:-0.4rem;">Complete a frase com a palavra certa.</p>
        <div id="corpo-quiz"></div>
      </div>
    </div>

    <div id="modal-perfil" class="modal-oculto">
      <div class="modal-conteudo">
        <div class="modal-cabecalho">
          <h3>Meu perfil</h3>
          <button type="button" class="btn-fechar-modal" title="Fechar" onclick="fecharPerfil()">✕</button>
        </div>
        <p class="dica-perfil">Seu professor usa esses dados pra entrar em contato, por exemplo se precisar cancelar ou remarcar uma aula.</p>
        <div class="campo-perfil">
          <label for="perfil-nome">Nome</label>
          <input type="text" id="perfil-nome" readonly>
        </div>
        <div class="campo-perfil">
          <label for="perfil-email">E-mail de contato</label>
          <input type="email" id="perfil-email" placeholder="voce@exemplo.com">
        </div>
        <div class="campo-perfil">
          <label for="perfil-telefone">Telefone / WhatsApp (com DDD)</label>
          <input type="tel" id="perfil-telefone" placeholder="Ex: 11 91234-5678">
        </div>
        <button class="btn btn-primario" style="margin-top:0.4rem;" onclick="salvarPerfil()">Salvar perfil</button>
        <p class="status-msg" id="status-perfil"></p>
      </div>
    </div>

    <div id="modal-agendamento" class="modal-oculto">
      <div class="modal-conteudo modal-largo">
        <div class="modal-cabecalho">
          <h3>Agendar aula</h3>
          <button type="button" class="btn-fechar-modal" title="Fechar" onclick="fecharAgendamento()">✕</button>
        </div>
        <div class="campo-agendamento">
          <label>Escolha o dia</label>
          <div id="calendario-agendamento"></div>
        </div>
        <div class="campo-agendamento campo-reposicao">
          <label class="rotulo-reposicao"><input type="checkbox" id="chk-reposicao"> Esta é uma aula de reposição</label>
          <p class="dica-reposicao" id="dica-reposicao"></p>
        </div>
        <div class="campo-agendamento" id="campo-modalidades-agendamento">
          <label>Modalidade</label>
          <div id="modalidades-agendamento" class="modalidades-agendamento"></div>
        </div>
        <div class="campo-agendamento">
          <label>Horários livres</label>
          <div id="slots-agendamento"><p class="vazio">Escolha uma data acima.</p></div>
        </div>
      </div>
    </div>

    <div id="painel-minhas-aulas" class="oculto" style="margin-bottom:2rem;">
      <h3 style="font-size:0.95rem;">Minhas próximas aulas</h3>
      <div id="lista-minhas-aulas"></div>
    </div>

    <div id="painel-mensagens" class="oculto" style="margin-bottom:2rem;">
      <h3 style="font-size:0.95rem;">Recados do professor</h3>
      <div id="lista-mensagens"></div>
    </div>

    <form class="formulario-palavra" onsubmit="event.preventDefault(); adicionarPalavra(document.getElementById('input-palavra-en').value, document.getElementById('input-palavra-pt').value, document.getElementById('input-palavra-nota').value); this.reset();">
      <div class="linha-palavra">
        <input type="text" id="input-palavra-en" placeholder="Palavra em inglês (ex: apple)" required>
        <input type="text" id="input-palavra-pt" placeholder="Tradução (ex: maçã)" required>
      </div>
      <textarea id="input-palavra-nota" class="textarea-nota-palavra" placeholder="Anotação (opcional) — ex: quando usar, diferença de outra palavra, dica pra lembrar..."></textarea>
      <button type="submit" class="btn btn-primario">Adicionar</button>
    </form>
    <p class="status-msg" id="status-palavra"></p>

    <div id="painel-anotacoes" style="margin-bottom:2rem;">
      <h3 style="font-size:0.95rem;">Minhas anotações</h3>
      <div class="caixa-mensagem" style="margin-bottom:1rem;">
        <textarea id="input-anotacoes" placeholder="Adicione anotações ou regras gramaticais aprendidas"></textarea>
        <button class="btn btn-primario" style="margin-top:0.6em;" onclick="adicionarAnotacao(document.getElementById('input-anotacoes').value)">Salvar anotação</button>
      </div>
      <div id="lista-anotacoes"></div>
    </div>

    <div class="grade-cartoes" id="grade-cartoes"></div>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/util.js"></script>
<script src="js/auth.js"></script>
<script src="js/tema.js"></script>
<script src="js/dicionario.js"></script>
</body>
</html>
