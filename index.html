<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Dicionário</title>
<script>
  // Aplica o tema salvo antes da página desenhar, pra não piscar a cor padrão
  (function () {
    var tema = localStorage.getItem("temaEscolhido");
    if (tema && tema !== "classico") document.documentElement.setAttribute("data-tema", tema);
  })();
</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="tela-auth">
  <div class="cartao-auth">
    <div class="eyebrow">MEU DICIONÁRIO</div>
    <h1>Vocabulário de inglês</h1>

    <div class="abas-tipo">
      <button class="aba-tipo ativa" id="btn-aba-login" onclick="mostrarAba('login')">Entrar</button>
      <button class="aba-tipo" id="btn-aba-cadastro" onclick="mostrarAba('cadastro')">Criar conta</button>
    </div>

    <!-- LOGIN -->
    <form id="form-login" onsubmit="event.preventDefault(); entrar(loginEmail.value, loginSenha.value);">
      <div class="campo">
        <label for="loginEmail">E-mail</label>
        <input type="email" id="loginEmail" required>
      </div>
      <div class="campo">
        <label for="loginSenha">Senha</label>
        <input type="password" id="loginSenha" required>
      </div>
      <button type="submit" class="btn btn-primario" style="width:100%">Entrar</button>
      <p class="status-msg" id="status-login"></p>
    </form>

    <!-- CADASTRO -->
    <form id="form-cadastro" class="oculto" onsubmit="event.preventDefault(); cadastrar(cadNome.value, cadEmail.value, cadSenha.value, cadTipo.value, cadCodigo.value);">
      <div class="campo">
        <label for="cadTipo">Sou</label>
        <select id="cadTipo" onchange="alternarCampoCodigo()">
          <option value="aluno">Aluno</option>
          <option value="professor">Professor</option>
        </select>
      </div>
      <div class="campo">
        <label for="cadNome">Nome</label>
        <input type="text" id="cadNome" required>
      </div>
      <div class="campo">
        <label for="cadEmail">E-mail</label>
        <input type="email" id="cadEmail" required>
      </div>
      <div class="campo">
        <label for="cadSenha">Senha</label>
        <input type="password" id="cadSenha" minlength="6" required>
      </div>
      <div class="campo" id="campo-codigo">
        <label for="cadCodigo">Código do professor</label>
        <input type="text" id="cadCodigo" placeholder="Ex: PROF-8X2K">
      </div>
      <button type="submit" class="btn btn-primario" style="width:100%">Criar conta</button>
      <p class="status-msg" id="status-cadastro"></p>
    </form>

    <p class="rodape-auth">Cada palavra aprendida fica guardada com tradução e um exemplo de frase.</p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script>
function mostrarAba(aba) {
  const ehLogin = aba === 'login';
  document.getElementById('form-login').classList.toggle('oculto', !ehLogin);
  document.getElementById('form-cadastro').classList.toggle('oculto', ehLogin);
  document.getElementById('btn-aba-login').classList.toggle('ativa', ehLogin);
  document.getElementById('btn-aba-cadastro').classList.toggle('ativa', !ehLogin);
}
function alternarCampoCodigo() {
  const ehAluno = document.getElementById('cadTipo').value === 'aluno';
  document.getElementById('campo-codigo').classList.toggle('oculto', !ehAluno);
}
</script>
</body>
</html>
